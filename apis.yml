aid: amazon-application-discovery-service
name: Amazon Application Discovery Service
description: >-
  Amazon Application Discovery Service helps enterprise customers plan application migration projects by automatically
  identifying servers, virtual machines, software, and software dependencies running in their on-premises data centers.
